services:
  postgres:
    image: postgres:16-alpine
    container_name: callejeandola-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: callejeandola
      POSTGRES_PASSWORD: callejeandola_dev_password
      POSTGRES_DB: callejeandola_dev
    ports:
      - "5432:5432"
    volumes:
      - callejeandola_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callejeandola -d callejeandola_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  callejeandola_pgdata: